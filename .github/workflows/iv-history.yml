name: IV history

# Builds the implied-vol history that IV Rank and IV Percentile need. No free
# source publishes one, so the only way to have it is to record it daily.
#
# On timing: GitHub's scheduler is not punctual. It has been seen running four
# to ten hours late, which once skewed a month of logs on another project. That
# is handled rather than hoped away -- the job runs after the close, and the
# fetcher keys every row by the trading session the CBOE snapshot belongs to
# rather than by the clock when the job happened to start. A run that slips to
# 3am still files its number under the right session, and a weekend run files
# under the Friday.

on:
  schedule:
    # 21:30 UTC is 17:30 in New York during daylight time and 16:30 otherwise,
    # so it is after the close either way. Weekdays only.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:          # and run it by hand whenever you like

permissions:
  contents: write

concurrency:
  group: iv-history
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet numpy pandas yfinance

      - name: Record today's implied vol
        run: python fetch/fetch_inputs.py --watchlist fetch/watchlist.txt --log-only

      # Publish what the hosted page reads. A browser cannot call CBOE or Yahoo
      # from github.io -- neither sends CORS headers, and that is true of any
      # code in a browser tab, Python included. This job has no such limit, so
      # it leaves the answers next to the page, same origin, and a phone needs
      # nothing installed. Prices go out as line-oriented CSV so a day's shift
      # is a few bytes of git delta rather than a rewritten blob.
      - name: Publish the daily snapshot
        run: python fetch/fetch_inputs.py --watchlist fetch/watchlist.txt --period 1y --publish data

      # Push on its own terms. Anything may have landed on main while this ran --
      # a commit from a laptop, another run of this job -- and the log must not be
      # the thing that fails. The CSVs are union-merged (.gitattributes), so a
      # rebase cannot conflict on them, and a duplicated session collapses on the
      # next run. Retry a few times in case of a genuine race for the ref.
      - name: Commit anything new
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetch/iv_history data
          if git diff --cached --quiet; then
            echo "Nothing changed -- this session was already recorded."
            exit 0
          fi
          git commit -m "Daily data: session $(date -u -d '5 hours ago' +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto what landed meanwhile (attempt $attempt)"
            git pull --rebase --no-edit origin main || exit 1
          done
          echo "could not push after three attempts" >&2
          exit 1
