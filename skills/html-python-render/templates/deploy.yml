name: Deploy to Render

# Render's own GitHub integration cannot be relied on: two pushes in a row have
# been seen leaving a service on an older build with Auto-Deploy reading "On
# Commit". Rather than guess at someone else's webhook, ask directly from a
# side you control.
#
# Setup, once: in Render open the service, Settings, find Deploy Hook, copy the
# URL. In GitHub open Settings, Secrets and variables, Actions, New repository
# secret named RENDER_DEPLOY_HOOK, paste it. The URL carries its own key, which
# is why it belongs in a secret and not in this file.
#
# Without the secret the job says so and exits clean, so the repo still works
# for anyone with no Render service.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to build this commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK secret set, so there is nothing to tell."
            echo "See the comment at the top of this file."
            exit 0
          fi
          code=$(curl -s -o /tmp/out -w "%{http_code}" "$HOOK")
          echo "Render answered $code"
          cat /tmp/out; echo
          case "$code" in
            2*) echo "Build requested." ;;
            *)  echo "Render refused the deploy hook." >&2; exit 1 ;;
          esac
