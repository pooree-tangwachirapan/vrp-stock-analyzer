# Render reads this when you connect the repo. Free tier, no card.
# It sets PORT itself, which vrp.py already honours, so there is nothing to
# configure in the dashboard beyond pointing it at this repository.
services:
  - type: web
    name: vrp-analyzer
    runtime: python
    plan: free
    region: oregon
    # Spelled out rather than relied on: two pushes went by without the service
    # rebuilding, so leave nothing to the default.
    autoDeploy: true
    branch: main
    buildCommand: pip install --no-cache-dir numpy pandas yfinance
    startCommand: python vrp.py --no-browser
    envVars:
      # Render's own default is now 3.14, which is new enough that numpy and
      # pandas may have no prebuilt wheels for it and pip would try to compile
      # them. Pin the version this was actually rehearsed against instead.
      - key: PYTHON_VERSION
        value: "3.12.10"
    healthCheckPath: /api/health
